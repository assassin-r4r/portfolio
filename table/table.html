<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Таблицы</title>
</head>
<style>
    body {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        padding: 50px;
        background-color: #18191c;
        color: #e6dfdf;
        font-family: "Roboto", sans-serif;
    }

    table {
        width: 650px;
        border-top: 7px solid rgb(43, 129, 17);
        border-collapse: collapse;
        text-align: center;
        margin-bottom: 20px;
        border: 1px solid #dddddd;
    }

    td {
        text-align: left;
        padding: 10px;
        border: 3px solid rgb(43, 129, 17);
    }

    th {
        text-align: center;
        padding: 10px;
        border: 3px solid rgb(43, 129, 17);
    }
</style>

<body>
    <h1>Построение таблицы на веб-странице</h1>
    <table>
        <tr>
            <th>Название</th>
            <th>Оригинальное название</th>
            <th>Год</th>
        </tr>
        <tr>
            <td>Человек-паук: Возвращение домой</td>
            <td>Spider_Man: Homecoming</td>
            <td>2017</td>
        </tr>
        <tr>
            <td>Человек-паук: Вдали от дома</td>
            <td>Spider-Man: Far From Home</td>
            <td>2019</td>
        </tr>
        <tr>
            <td>Человек-паук: Нет пути домой</td>
            <td>Spider-Man: No Way Home</td>
            <td>2021</td>
        </tr>
</html>
