<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Игра "Угадай число"</title>
</head>
<style>
    body {
        margin: 20px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 20px;
        background-color: #f1f1f1;
        font-family: Arial, Helvetica, sans-serif;
    }

    form {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
    }

    .number {
        border-radius: 10px;
        border-color: black;
        width: 50px;
        height: 50px;
        font-size: xx-large;
    }

    .go {
        border-radius: 10px;
        border-color: black;
        width: 200px;
        height: 30px;
        font-size: large;
        background-color: rgb(170, 170, 255);
    }

</style>
<body>
    <h1 id="hh">Угадай число!</h1>
    <p id="pp">Компьютер загадывает число от 0 до 100, вы должны отгадать его.</p>
    <form action="">
        <input type="text" id="otvet" class="number">
    <p>
        <input type="submit" value="Испытать удачу!" class="go">
    </p>
    </form>

    <p id="popitk"></p>
    
    <script src="code.js"></script>
</body>
</html>
